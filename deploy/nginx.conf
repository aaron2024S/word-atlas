server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文件名带内容 hash 的构建产物，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 插画与音频体积大、且按内容更新，给 30 天缓存
    location ~* \.(?:mp3|m4a|wav|webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 词库索引：允许长缓存但每次用 ETag 复验
    location /atlas/index.json {
        expires 1h;
    }

    # PWA 清单与 Service Worker：必须能及时更新
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 纯前端应用，其余路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文本类资源压缩；图片/音频本身已压缩，不重复处理
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 隐藏 nginx 版本号
    server_tokens off;
}
