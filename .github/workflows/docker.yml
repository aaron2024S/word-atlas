name: Build and push Docker image

# 推 main 且改到构建相关文件时自动构建；也可以手动 Run workflow 指定标签
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'
        type: string

env:
  IMAGE_NAME: word-atlas

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # 站点是纯静态资源，构建阶段不依赖目标架构；需要 arm64 时在下面一行追加 ,linux/arm64
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=词光 Word Atlas
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false

      - name: 写入运行摘要
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${DOCKERHUB_USER}/${IMAGE_NAME}:${IMAGE_TAG}\` |"
            echo "| 平台 | \`linux/amd64\` |"
            echo "| 摘要 | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo '```bash'
            echo "docker pull ${DOCKERHUB_USER}/${IMAGE_NAME}:${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
